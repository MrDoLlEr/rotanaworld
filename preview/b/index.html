<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
    <meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#030b06" />
<title>عالم روتانا</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Cairo:wght@700;800;900&family=Geist:wght@500;600&display=swap" />
<style>
:root { --bg:#030b06; --green:#18c780; --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif; --safe-b: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:var(--font); -webkit-font-smoothing:antialiased; }
body { overflow:hidden; }
html[lang="en"] body { font-family:"Geist","Cairo",system-ui,sans-serif; }
#bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:#030b06; }
#bg canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#bg.fb { background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.4px); background-size:16px 16px; }

.app { position:relative; z-index:1; height:100dvh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; }
/* top */
.top { flex:none; padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 4px; text-align:center; position:relative; }
.lang { position:absolute; top: calc(env(safe-area-inset-top,0px) + 12px); inset-inline-end:14px; z-index:3; height:34px; min-width:54px; padding:0 12px; border-radius:999px; border:1px solid rgba(255,255,255,.45); background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04)); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); color:#fff; font:700 13px/1 "Cairo",var(--font); }
.x-dt { position:relative; width:78%; max-width:340px; margin:6px auto 0; aspect-ratio:3.4/1; }
.x-dt canvas { position:relative; display:block; width:100%; height:100%; filter: drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 14px rgba(255,255,255,.45)); }
.x-dt__text { position:absolute; inset:0; margin:0; display:flex; align-items:center; justify-content:center; font:900 44px/1 "Cairo",var(--font); color:#fff; }
.x-dt.is-dots .x-dt__text { color:transparent; }
.sub { margin:2px 0 0; font:800 19px/1.4 "Cairo",var(--font); text-shadow:0 2px 12px rgba(0,0,0,.55); }
html[lang="en"] .sub { font-family:"Geist","Cairo",sans-serif; font-weight:600; }

/* slides */
.track { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
.track::-webkit-scrollbar { display:none; }
.slide { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; align-items:center; padding:10px 18px 14px; min-height:0; }
.slide__in { flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:12px; min-height:0; }
.hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:0; text-align:center; }

/* glass */
.glass { position:relative; isolation:isolate; overflow:hidden; border:1.5px solid rgba(255,255,255,.55);
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 55%,rgba(255,255,255,.08));
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.18), inset 0 0 22px rgba(190,225,255,.10), 0 0 18px rgba(200,230,255,.12), 0 22px 50px rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(16px) saturate(170%); backdrop-filter: blur(16px) saturate(170%); }
.glass::before { content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none;
  background: linear-gradient(118deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 34%, rgba(255,255,255,0) 34.4%, rgba(255,255,255,0) 58%, rgba(255,255,255,.07) 58.4%, rgba(255,255,255,0) 72%),
  radial-gradient(18px 3px at 14% 0%, rgba(255,255,255,.95), rgba(255,255,255,0)), radial-gradient(3px 16px at 100% 62%, rgba(255,255,255,.85), rgba(255,255,255,0)); }
.glass::after { content:""; position:absolute; top:-20%; bottom:-20%; left:-60%; width:38%; z-index:-1; pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0)); transform:skewX(-18deg); animation: sheen 6s ease-in-out infinite; }
@keyframes sheen { 0%,60% { transform:translateX(0) skewX(-18deg); } 100% { transform:translateX(520%) skewX(-18deg); } }

.orb { width:min(52vw,210px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:15%; flex:none; }
.orb img { max-width:100%; max-height:62%; object-fit:contain; display:block; }
.orb--tunes img { max-height:78%; }
.name { margin:0; font:700 15px/1 var(--font); letter-spacing:.02em; color:rgba(255,255,255,.75); }
.line { margin:0; font:900 clamp(24px,7.2vw,32px)/1.35 "Cairo",var(--font); text-shadow:0 2px 14px rgba(0,0,0,.6); max-width:16ch; }
html[lang="en"] .line { font-family:"Geist","Cairo",sans-serif; font-weight:600; font-size:clamp(22px,6.4vw,28px); max-width:20ch; }

/* action sheet (thumb zone) */
.sheet { width:100%; border-radius:28px; padding:16px; display:flex; flex-direction:column; gap:10px; flex:none; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:54px; padding:10px 16px; border-radius:18px; text-decoration:none; color:#06110b; background:#fff; font:700 16px/1.2 var(--font); box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.08); }
.btn--ghost { color:#fff; background:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.10)); border:1px solid rgba(255,255,255,.3); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.btn:active { transform:scale(.98); }
.b-arr { width:18px; height:18px; flex:none; }
html[lang="ar"] .b-arr { transform:scaleX(-1); }
.b-store { direction:ltr; display:flex; align-items:center; justify-content:center; gap:12px; min-height:56px; border-radius:18px; text-decoration:none; color:#fff; background:#000; border:1px solid rgba(255,255,255,.3); }
.b-store--pick { border-color:var(--green); box-shadow:0 0 0 1px var(--green),0 0 18px rgba(24,199,128,.3); }
.b-store__logo { width:24px; height:26px; flex:none; display:block; }
.b-store__txt { display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; font-family:"Geist",system-ui,sans-serif; }
.b-store__txt small { font-size:12px; color:rgba(255,255,255,.85); }
.b-store__txt b { font-size:19px; font-weight:600; }
.icons { display:flex; justify-content:center; gap:8px; flex-wrap:nowrap; padding-top:2px; }
.b-icon { position:relative; overflow:hidden; width:44px; height:44px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:13px; border:1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px rgba(0,0,0,.35); }
.b-icon::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,0) 48%); }
.b-icon svg { width:22px; height:22px; position:relative; display:block; }
.b-icon--ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.b-icon--x, .b-icon--tt { background:#000; }
.b-icon--yt, .b-icon--fb { background:#fff; }
.b-icon--yt svg, .b-icon--fb svg { width:26px; height:26px; }
.b-icon--sc { background:#FFFC00; }

/* bottom tabs */
.tabs { flex:none; margin:0 14px calc(var(--safe-b) + 12px); border-radius:24px; padding:6px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.tab { position:relative; border:0; background:transparent; color:rgba(255,255,255,.7); border-radius:18px; padding:8px 4px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; font:700 15px/1 var(--font); cursor:pointer; min-height:46px; justify-content:center; }
.tab img { height:22px; width:auto; opacity:.75; }
.tab[aria-selected="true"] { color:#fff; background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.tab[aria-selected="true"] img { opacity:1; }
.tab[aria-selected="true"]::after { content:""; position:absolute; bottom:-2px; width:18px; height:3px; border-radius:3px; background:var(--green); box-shadow:0 0 8px var(--green); }
.hint { position:absolute; bottom: calc(var(--safe-b) + 96px); left:50%; transform:translateX(-50%); font:600 12px/1 var(--font); color:rgba(255,255,255,.6); pointer-events:none; transition:opacity .4s; white-space:nowrap; }
.hint.off { opacity:0; }
@media (max-height: 700px) { .orb { width:min(40vw,150px); } .line { font-size:22px; } .x-dt { width:62%; } .sub { font-size:16px; } .btn, .b-store { min-height:48px; } }
@media (prefers-reduced-motion: reduce) { .glass::after { display:none; } .track { scroll-behavior:auto; } }
</style>
</head>

<script>
(function () {
  var track = document.getElementById("track"), tabs = document.querySelectorAll(".tab"), hint = {classList:{add:function(){}}};
  var ids = ["music", "live", "tunes"];
  function go(id, smooth) {

    track.scrollTo({ left: el.offsetLeft - track.offsetLeft, behavior: smooth === false ? "auto" : "smooth" });

  }
  function mark(id) {

  }

  tabs.forEach(function (t) { t.addEventListener("click", function () { go(t.getAttribute("data-go")); history.replaceState(null, "", "#" + t.getAttribute("data-go")); }); });
  var st;

  function fromHash() { var h = (location.hash || "").slice(1); if (ids.indexOf(h) >= 0) { go(h, false); hint.classList.add("off"); } else mark("music"); }

  var wrap = document.getElementById("stores"), pick = ios ? "ios" : andr ? "android" : null;
